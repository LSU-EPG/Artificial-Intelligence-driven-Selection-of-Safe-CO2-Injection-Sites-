[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "node_attribute"
version = "0.1.0"
description = "Edge list builder for sink/candidate/source/pipeline/population node attributes"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
